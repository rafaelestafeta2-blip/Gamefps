name: Build Native Android APK (Capacitor + WebGL GPU)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar APK Nativo Android (KINETIC FPS)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Configurar Java JDK 21 (Requisito Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar Dependências e Compilar Jogo (Vite Production Build)
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
          npm run build

      - name: 6. Gerar e Sincronizar Plataforma Nativa Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Otimizar AndroidManifest.xml (Landscape + GPU Hardware Acceleration + Fullscreen)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Força aceleração máxima de hardware GPU e orientação horizontal (sensorLandscape) para FPS
            sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape" android:hardwareAccelerated="true" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"/g' "$MANIFEST"
            # Adiciona permissão de Vibração Tátil (Haptics) se ainda não existir
            if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
              sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.VIBRATE" \/>\n<\/manifest>/g' "$MANIFEST"
            fi
          fi

      - name: 8. Compilar APK Nativo via Gradle (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Renomear e Publicar APK nos Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: KINETIC-Tactical-FPS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Build Native Android APK (Capacitor + WebGL GPU)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar APK Nativo Android (KINETIC FPS)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar Java JDK 17 (Requisito Gradle/Android AGP)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 5. Instalar Dependências e Compilar Web App (Vite Production Build)
        run: |
          npm ci || npm install
          npm run build

      - name: 6. Gerar e Sincronizar Plataforma Nativa Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Otimizar AndroidManifest.xml (Landscape + GPU Hardware Acceleration + Haptics)
        run: |
          node scripts/patch-android-manifest.js

      - name: 8. Compilar APK Nativo via Gradle (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Publicar APK nos Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: KINETIC-Tactical-FPS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
